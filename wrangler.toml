# Cloudflare Workers + D1. The Deploy to Cloudflare button (README) creates the D1 database and fills in its id.
# Deploying by hand: `npx wrangler d1 create opentrack`, put the id it prints below, then `npm run deploy:cf`.
name = "opentrack"
main = "server/worker.js"
compatibility_date = "2026-11-01"
workers_dev = true
# keep variables set in the dashboard when deploying
keep_vars = true

[vars]
# "true" turns on the public read-only demo account (server/lib/demo.js). Leave off for a real workspace.
DEMO_MODE = "false"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*", "/mcp", "/oauth/*", "/.well-known/*", "/feeds/*", "/slack/*"]

[[d1_databases]]
binding = "DB"
database_name = "opentrack"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[observability]
enabled = true
